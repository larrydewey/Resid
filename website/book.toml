# book.toml — the Resid documentation, served by resid-book.
#
#   ../resid-book/resid-book book.toml          # from this directory
#
# `base = "/Resid"` because the published site lives under that path on
# GitHub Pages and every link in the content is written for it. The server
# strips the prefix when routing, so a page's own links work unchanged.
[book]
title = "Resid"
tagline = "What Remains is What Matters"
base = "/Resid"
content = "src/content/docs"
assets = "src/assets,public"
repository = "https://github.com/larrydewey/Resid"
edit_base = "https://github.com/larrydewey/Resid/edit/master/website/"

# "topic|Label|link" starts a topic, "group|Label" a group inside it, and
# "page|slug" a page, labelled by its own frontmatter title. An empty slug
# is the book's home page.
nav = [
    "topic|Learn Resid|learn",
    "group|Start",
