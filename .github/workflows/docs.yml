# Builds the documentation site and publishes it to GitHub Pages at
# https://larrydewey.github.io/Resid/.
#
# The site is exported by resid-book (the book/docs server, in Resid, on
# resid-datastar): a self-hosted compiler exports every page to static HTML
# plus the assets, which is what Pages serves. There is no Node here.
#
# resid-book lives beside the repository; this workflow checks it out next
# to it, along with resid-datastar and the two libraries that SDK imports.
name: docs

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "compiler/driver.resid"
      - "runtime/rt/rt.resid"
      - "lib/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: resid

      # The book server and the Datastar SDK it renders with, side by side.
      - uses: actions/checkout@v4
        with:
          repository: larrydewey/resid-book
          path: resid-book
      - uses: actions/checkout@v4
        with:
          repository: larrydewey/resid-datastar
          path: resid-datastar
      - uses: actions/checkout@v4
        with:
          repository: larrydewey/resid-json
          path: resid-json
      - uses: actions/checkout@v4
        with:
          repository: larrydewey/resid-serial
          path: resid-serial
      - uses: actions/checkout@v4
        with:
          repository: larrydewey/resid-toml
          path: resid-toml

      # The compiler is the committed artifact, not a build: stage2.bin and
      # rt.ll ship in the repository. Building it here would need a signing
      # key (release builds are signed), and the docs workflow has no reason
      # to re-derive the fixed point.
      - name: Dependency map
        working-directory: resid
        env:
          RESID_HOME: ${{ github.workspace }}/resid/build/boot
        run: |
          build/boot/stage2.bin tools/resid-manifest.resid -o target/resid-manifest --profile debug
          cd ../resid-book
          ../resid/target/resid-manifest depmap resid.toml deps.txt

      - name: Export the site
        working-directory: resid-book
        env:
          RESID_HOME: ${{ github.workspace }}/resid/build/boot
        run: |
          ../resid/build/boot/stage2.bin src/site.resid -o resid-book --profile debug -depmap deps.txt
          ./resid-book export ../resid/website/book.toml ../resid/website/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: resid/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4