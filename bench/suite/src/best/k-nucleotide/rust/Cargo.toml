[package]
name = "k-nucleotide"
version = "0.1.0"
edition = "2015"
publish = false

# Standalone package: keep it out of the repository-root Cargo workspace.
[workspace]

[dependencies]
futures = "0.1"
tokio-threadpool = "0.1"
itertools = "0.14"
num = "0.4"
hashbrown = "0.15"

# Benchmarks Game: rustc -C opt-level=3 -C codegen-units=1 (plus target-cpu, set in ./build).
[profile.release]
opt-level = 3
codegen-units = 1
