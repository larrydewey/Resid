[package]
name = "pidigits"
version = "0.1.0"
edition = "2015"
publish = false

# Standalone package: keep it out of the repository-root Cargo workspace.
[workspace]

[dependencies]
rug = { version = "1.30", default-features = false, features = ["integer", "std"] }
gmp-mpfr-sys = { version = "1", default-features = false, features = ["use-system-libs"] }

# Benchmarks Game: rustc -C opt-level=3 -C codegen-units=1 (plus target-cpu, set in ./build).
[profile.release]
opt-level = 3
codegen-units = 1
