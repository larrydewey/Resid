# Kernel trees tools/resid-devgen reads (PLAN-device-access.md §6.2).
#
# `generate` is the tree the lib/dev/uapi_*.resid descriptors are generated
# from; its headers are committed under tools/devgen/uapi/ (the snapshot),
# so `resid-devgen --check` needs no network. `matrix` is every tree the
# release job (`resid-devgen --matrix`) compares the descriptors against:
# the oldest kernel of each interface, every LTS line, the current stable
# release and the latest mainline tag. A pin is a tag *and* the commit it
# must resolve to, so a moved tag or a mirror that serves another tree is
# refused, not trusted. Commits are the peeled tags of
# https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git.
#
# To move a pin: `git ls-remote --tags <stable repo> 'v6.18.*'`, take the
# `^{}` line's commit, edit the entry, run `tools/resid-devgen --matrix`.
# To move `generate`: also `tools/resid-devgen --snapshot` then `--write`,
# and review the diff of tools/devgen/uapi/ and lib/dev/uapi_*.resid.

remote = "https://github.com/gregkh/linux.git"

