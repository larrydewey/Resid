[package]
name = "resid-lsp2"
version = "0.2.0"
edition = "2024"

[dependencies]
tower-lsp = { version = "0.20", features = ["runtime-tokio"] }
tower = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

resid-lexer = { path = "../../crates/resid-lexer" }
resid-parser = { path = "../../crates/resid-parser" }
resid-type = { path = "../../crates/resid-type" }
resid-ir = { path = "../../crates/resid-ir" }
resid-notes = { path = "../resid-notes" }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "resid-lsp"
path = "src/main.rs"